<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Species Catalogue</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {
      font-family: 'Roboto', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #FFD1DC, #FFE29F, #C1FFD7, #A1C4FD);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: #333;
    }
    @keyframes gradientShift {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 50px 35px;
      border-radius: 25px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      backdrop-filter: blur(15px);
      width: 90%;
      max-width: 500px;
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: translateY(-5px);
    }

    h1 { font-family: 'Playfair Display', serif; font-size:2.8rem; margin-bottom:10px; color:#FF6F61; }
    h2 { font-size:1.3rem; margin-bottom:40px; color:#FF8C94; font-weight:400; }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-wrapper input[type="text"] {
      width: 100%;
      padding: 15px 60px 15px 45px; /* space for icon and button */
      border: none;
      border-radius: 50px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      font-size: 1rem;
      transition: all 0.3s ease;
      background: linear-gradient(145deg, #ffffff, #f0f8ff);
    }

    .input-wrapper input[type="text"]:focus {
      outline: none;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transform: scale(1.03);
      background: linear-gradient(145deg, #fff0f5, #f0fff0);
    }

    .input-wrapper svg.search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #333;
      pointer-events: none;
    }

    .input-wrapper .search-btn {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: linear-gradient(135deg, #FF6F61, #FF9A8B);
      color: #fff;
      font-weight: 700;
      border-radius: 50px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .input-wrapper .search-btn:hover {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .search-wrapper {
      display: block;
    }

    @media(max-width:500px) {
      h1{font-size:2.2rem;} 
      h2{font-size:1.1rem;}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Species Catalogue</h1>
    <h2>Find info about any species!</h2>
    <div class="search-wrapper">
      <form class="input-wrapper" onsubmit="return sayhi()">
        <input type="text" placeholder="Type a species name..." id="search-input">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
        </svg>
        <button type="submit" class="search-btn">Search</button>
      </form>
    </div>
  </div>
  <script>
    async function sayhi() {
      event.preventDefault();
      const search = document.getElementById("search-input").value;
      console.log("getting data...");
      try {
        const response = await fetch(`http://127.0.0.1:8000/species?search=${search}`);
        const data = await response.json();
        console.log(data);
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
