<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Species Catalogue</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #FFD1DC, #FFE29F, #C1FFD7, #A1C4FD, #FFB347, #6A82FB);
      background-size: 400% 400%;
      animation: gradientShift 25s ease infinite;
      color: #333;
    }
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes textColorShift {
      0%   { color: #FF6F61; }
      25%  { color: #61A9FF; }
      50%  { color: #FFD700; }
      75%  { color: #32CD32; }
      100% { color: #FF6F61; }
    }
    h1, .card h3 {
      animation: textColorShift 25s ease infinite;
    }

    .wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 70vh;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 50px 35px;
      border-radius: 25px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      backdrop-filter: blur(15px);
      width: 90%;
      max-width: 500px;
      transition: transform 0.3s ease;
    }
    .container:hover {
      transform: translateY(-5px);
    }

    h1 { font-family: 'Playfair Display', serif; font-size:2.8rem; margin-bottom:10px; color:#FF6F61; }
    h2 { font-size:1.3rem; margin-bottom:40px; color:#FF8C94; font-weight:400; }

    .input-wrapper {
      position: relative;
      width: 100%;
    }
    .input-wrapper input[type="text"] {
      width: 100%;
      padding: 15px 60px 15px 45px;
      border: none;
      border-radius: 50px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      font-size: 1rem;
      transition: all 0.3s ease;
      background: linear-gradient(145deg, #ffffff, #f0f8ff);
    }
    .input-wrapper input[type="text"]:focus {
      outline: none;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transform: scale(1.03);
      background: linear-gradient(145deg, #fff0f5, #f0fff0);
    }
    .input-wrapper svg.search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #555;
      pointer-events: none;
    }
    .input-wrapper .search-btn {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: linear-gradient(135deg, #FF6F61, #FF9A8B);
      color: #fff;
      font-weight: 700;
      border-radius: 50px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .input-wrapper .search-btn:hover {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .search-wrapper {
      display: block;
    }
    .container p {
      font-size: 0.8rem;
      color: #555;
      margin-top: 8px;
      text-align:center;
    }

    .dashboard {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 15px;
      justify-content: center;
      width: 100%;
      padding: 0 10px;
    }
    .card {
      width: 200px;
      background: #f8f8f8;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 10px;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .card h3 {
      font-size: 14px;
      margin: 5px 0;
      text-align: left;
    }
    .card p {
      font-size: 12px;
      margin: 2px 0;
      text-align: left;
    }

    .spinner {
      border: 4px solid rgba(0,0,0,0.1);
      border-left-color: #FF8c94;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      color: #444;
      margin-top: 10px;
    }
    .search-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media(max-width:500px) {
      h1{font-size:2.2rem;} 
      h2{font-size:1.1rem;}
    }

    @media (max-width: 450px) {
      .dashboard {
        gap: 10px;
        justify-content: center;
        margin-top: 5px;
        padding: 0 5px;
      }
      .spinner {
        margin: 5px auto;
      }
      .card {
        flex: 1 1 45%;
        max-width: 45%;
        min-width: 120px;
      }
      .input-wrapper input[type="text"] {
        padding: 12px 50px 12px 35px;
        font-size: 0.85rem;
      }
      .input-wrapper .search-btn {
        padding: 8px 15px;
        font-size: 0.75rem;
      }
      .input-wrapper svg.search-icon {
        left: 10px;
      }
      .container p {
        font-size: 0.7rem;
      }
    }

    @media (max-width: 350px) {
      .dashboard {
        margin-top: 0px;
        padding: 0 3px;
      }
      .spinner {
        margin: 1px auto;
      }
      .input-wrapper input[type="text"] {
        padding: 12px 50px 12px 35px;
        font-size: 0.75rem;
      }
      .input-wrapper .search-btn {
        padding: 8px 15px;
        font-size: 0.75rem;
      }
      .input-wrapper svg.search-icon {
        left: 10px;
      }
      .container p {
        font-size: 0.65rem;
      }
    }
    
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <h1>Species Catalogue</h1>
      <h2>Find info about any species!</h2>
      <div class="search-wrapper">
        <form class="input-wrapper" onsubmit="runSearch(event)">
          <input type="text" placeholder="Type a species name..." id="search-input">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
          </svg>
          <button type="submit" class="search-btn">Search</button>
        </form>
      </div>
      <p>e.g: "Panthera  leo", "butterfly", "Bos indicus", e.t.c.</p>
    </div>
  </div>
  <div id="species-dashboard" class="dashboard"></div>
  <script>
    async function runSearch(event) {
    event.preventDefault();

      const search = document.getElementById("search-input").value.trim();
      const dashboard = document.getElementById("species-dashboard");
      const button = document.querySelector(".search-btn");

      if (!search) {
        alert("Please enter a species name.");
        return;
      }
      button.disabled = true;

      dashboard.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <span>Loading results...</span>
        </div>
      `;

      try {
        const response = await fetch(`http://127.0.0.1:8000/species?search=${encodeURIComponent(search)}`);
        const data = await response.json();

        button.disabled = false;

        if (!data.data.length) {
          dashboard.innerHTML = "<p>No species found.</p>";
          return;
        }
        dashboard.innerHTML = ``;

        data.data.forEach(animal => {
          const card = document.createElement("div");
          card.className = "card";

          const img = document.createElement("img");
          img.src = animal.image || "https://via.placeholder.com/200x120.png?text=No+Image";
          img.alt = animal.vernacularName || animal.scientificName || "Species image";
          card.appendChild(img);

          const name = document.createElement("h3");
          name.textContent = animal.vernacularName || animal.scientificName;
          card.appendChild(name);

          const sciName = document.createElement("p");
          sciName.textContent = `Scientific: ${animal.scientificName || "N/A"}`;
          card.appendChild(sciName);

          const author = document.createElement("p");
          author.textContent = `Authorship: ${animal.authorship || "Unknown"}`;
          card.appendChild(author);

          const kingdom = document.createElement("p");
          kingdom.textContent = `Kingdom: ${animal.kingdom || "N/A"}`;
          card.appendChild(kingdom);

          const habitats = document.createElement("p");
          habitats.textContent = `Habitats: ${Array.isArray(animal.habitats) && animal.habitats.length ? animal.habitats.join(", ") : "Unknown"}`;
          card.appendChild(habitats);

          const threats = document.createElement("p");
          threats.textContent = `Threat: ${Array.isArray(animal.threatStatuses) && animal.threatStatuses.length ? animal.threatStatuses.join(", ") : "Unknown"}`;
          card.appendChild(threats);

          const extinct = document.createElement("p");
          extinct.textContent = `Extinct: ${animal.extinct ? "Yes" : "No"}`;
          card.appendChild(extinct);

          dashboard.appendChild(card);
        });

      } catch (error) {
        dashboard.innerHTML = "<p>Something went wrong. Please try again.</p>";
        button.disabled = false;
        console.error(error);
      }
    }
  </script>
</body>
</html>
